<section>
<h2>Day 1: Trustworthy experiments</h2>
<ol>
<li><p>T-101 assigned 200,000 customers; 85,080 searched. You want the effect of the new ranking on the people it can reach. Which comparison do you report?</p><ul><li><b>A.</b> Treatment customers who searched against all control customers</li><li><b>B.</b> Customers who searched in treatment against customers who searched in control</li><li><b>C.</b> All treatment customers against all control customers, because it uses more data</li><li><b>D.</b> Each searcher's orders before and after the first search</li></ul></li>
<li><p>A 50/50 test shows +3% orders with p = 0.002. Its sample ratio check gives p = 0.0004: the treatment arm has 1.2% fewer users than planned. What do you do?</p><ul><li><b>A.</b> Report the lift: the arms are large and the gap is only 1.2%</li><li><b>B.</b> Reweight the treatment arm up to 50% and report the adjusted lift</li><li><b>C.</b> Report no result, find where users are lost, fix it and rerun</li><li><b>D.</b> Correct both p-values for multiple testing and report what survives</li></ul></li>
<li><p>The AI ranking lifts orders by 3.9% (interval well above zero). Its p95 latency is 420 ms worse; the pre-registered limit was 300 ms. What does the spec say?</p><ul><li><b>A.</b> Not a launch as is: the latency guardrail fails, so the decision rule applies</li><li><b>B.</b> Launch: a 3.9% lift is worth more than 120 ms</li><li><b>C.</b> Raise the latency limit to 450 ms and launch</li><li><b>D.</b> Report latency as a side note to the primary result</li></ul></li>
<li><p>A test needs 41,000 customers per arm to detect a 2% lift in orders with 80% power. The product manager now wants to detect 1%. Roughly how many per arm?</p><ul><li><b>A.</b> 82,000</li><li><b>B.</b> 58,000</li><li><b>C.</b> 20,500</li><li><b>D.</b> 164,000</li></ul></li>
<li><p>A test of a new filter on the restaurant list assigns 120,000 customers; 30,000 open the filter panel, which is logged in both arms. Which population gives the most precise unbiased estimate of the filter's effect?</p><ul><li><b>A.</b> Everyone assigned, because the sample is four times larger</li><li><b>B.</b> Customers who opened the panel, in both arms</li><li><b>C.</b> Treatment customers who opened the panel against all control customers</li><li><b>D.</b> Customers who used the filter at least once, in treatment only</li></ul></li>
<li><p>A test triggers 25% of assigned customers and shows a 6% lift among them, with similar baselines in both groups. Roughly what lift should the analysis over everyone assigned show?</p><ul><li><b>A.</b> 1.5%</li><li><b>B.</b> Nothing can be said without rerunning the test</li><li><b>C.</b> 6%, because the effect is a property of the change</li><li><b>D.</b> 24%, the triggered lift divided by the trigger rate</li></ul></li>
<li><p>A 50/50 test shows a 2.5% lift with p = 0.01. Its sample ratio check gives p = 0.0002; the treatment arm is short of users on one browser. What should the analyst report?</p><ul><li><b>A.</b> The lift, after reweighting the arms to 50/50</li><li><b>B.</b> The lift, with a note on the mismatch</li><li><b>C.</b> The lift computed on the other browsers only</li><li><b>D.</b> No result until the cause is fixed and the test rerun</li></ul></li>
<li><p>Five hundred A/A reshuffles of last month's data, analysed with the team's standard test, give 11% of p-values below 0.05. What is the most likely explanation?</p><ul><li><b>A.</b> A/A tests always show more false wins than 5%</li><li><b>B.</b> Last month had unusual traffic</li><li><b>C.</b> The analysis is miscalibrated, for example tested at a smaller unit than the one randomised</li><li><b>D.</b> Five hundred reshuffles are too few to say anything</li></ul></li>
<li><p>A pre-registered test of an AI search ranking has orders per customer as primary and a latency guardrail of at most +300 ms at p95. Results: orders +3% (interval above zero), p95 latency +410 ms. What follows?</p><ul><li><b>A.</b> Launch, and raise the latency limit for the next test</li><li><b>B.</b> Not a launch as is: apply the written decision rule for a failed guardrail</li><li><b>C.</b> Rerun the test with latency as the primary metric</li><li><b>D.</b> Launch, since the primary metric won</li></ul></li>
<li><p>A harm guardrail says complaints per 1,000 orders must not rise by more than 1.0. The estimate is +0.3 with a 95% interval from -0.5 to +1.4. Does the guardrail hold?</p><ul><li><b>A.</b> No, because the upper bound exceeds 1.0</li><li><b>B.</b> No, because any rise in complaints fails a harm guardrail</li><li><b>C.</b> Yes, because the estimate is below 1.0</li><li><b>D.</b> Yes, because the difference is not statistically significant</li></ul></li>
<li><p>A test analysis needs the number of complaints per order. The data team offers the complaint category and the full complaint text, both collected for customer support and product improvement. Which should the analysis use?</p><ul><li><b>A.</b> Neither, because complaints are personal data</li><li><b>B.</b> Both, because more detail gives a better metric</li><li><b>C.</b> The text only, because categories can be wrong</li><li><b>D.</b> The category only</li></ul></li>
<li><p>A test needs 30,000 customers per arm to detect a 3% lift with 80% power. How many per arm are needed to detect a 1.5% lift with the same power?</p><ul><li><b>A.</b> 60,000</li><li><b>B.</b> 42,000</li><li><b>C.</b> 120,000</li><li><b>D.</b> 15,000</li></ul></li>
<li><p>Why size a test by simulation on historical data when a formula exists?</p><ul><li><b>A.</b> The formula is only valid for proportions</li><li><b>B.</b> Simulation uses the metric's real distribution and the exact analysis that will be run</li><li><b>C.</b> Simulation always gives a smaller sample size</li><li><b>D.</b> The formula needs the effect size, which simulation does not</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Precision</h2>
<ol>
<li><p>Ruba receives the results of a 28-day test with a 4% lift on the primary metric, all guardrails green. Which check does she run before reading any of it?</p><ul><li><b>A.</b> Regression adjustment, to narrow the interval</li><li><b>B.</b> A false discovery correction over the segments</li><li><b>C.</b> The sample ratio check on the assignment counts</li><li><b>D.</b> A power calculation for the observed effect</li></ul></li>
<li><p>Ruba wants to cap order value at the 99th percentile for T-101's revenue metric. Which data should set the cap?</p><ul><li><b>A.</b> Order values from both arms pooled, or from history before the test</li><li><b>B.</b> Order values of the control arm only</li><li><b>C.</b> Each arm's own 99th percentile</li><li><b>D.</b> Whichever cap gives the smallest p-value</li></ul></li>
<li><p>Ruba wants a stronger adjustment for T-101 and considers adding one more covariate to the regression. Which one is safe?</p><ul><li><b>A.</b> Number of searches during the test</li><li><b>B.</b> Revenue during the test</li><li><b>C.</b> Day of the first search in the test</li><li><b>D.</b> Revenue in the 28 pre-period days</li></ul></li>
<li><p>A test randomises customers and reports clicks per page view: 1.9 million views, 80,000 customers. Which standard error should the analysis use?</p><ul><li><b>A.</b> The binomial standard error over 1.9 million views</li><li><b>B.</b> A delta-method standard error over the 80,000 customers</li><li><b>C.</b> The standard error of the mean of each customer's click rate</li><li><b>D.</b> A bootstrap that resamples page views</li></ul></li>
<li><p>Sufrah plans a 2,000-customer pilot in two cities whose customers order at very different rates. Which design reduces the variance of the estimate most?</p><ul><li><b>A.</b> A simple 50/50 randomisation, analysed as a simple difference</li><li><b>B.</b> Strata for every district, analysed per district</li><li><b>C.</b> Randomisation within each city, analysed with the city strata</li><li><b>D.</b> A separate test in each city, reported side by side</li></ul></li>
<li><p>An analyst caps basket value for a promotion test at each arm's own 99th percentile. The treatment arm has more large baskets. What is the problem?</p><ul><li><b>A.</b> The cap now depends on the treatment, so it can create or hide a difference</li><li><b>B.</b> A 99th percentile cap is too loose to matter</li><li><b>C.</b> None: each arm is treated by the same rule</li><li><b>D.</b> The treatment arm is capped lower in relative terms than control</li></ul></li>
<li><p>Capping order value at a lower percentile always reduces the standard error of revenue per customer. Why not cap at the median?</p><ul><li><b>A.</b> A median cap would make the sample ratio check fail</li><li><b>B.</b> Regulators forbid capping below the 90th percentile</li><li><b>C.</b> The standard error would rise again below some cap</li><li><b>D.</b> The estimand moves away from revenue and the bias grows until it dominates the error</li></ul></li>
<li><p>The correlation between a metric in the pre-period and in the test period is 0.6. Regression adjustment on the pre-period gives roughly what effective sample-size gain?</p><ul><li><b>A.</b> 1.6 times</li><li><b>B.</b> 2.5 times</li><li><b>C.</b> 1.56 times</li><li><b>D.</b> No gain, because the pre-period has no treatment effect</li></ul></li>
<li><p>Which covariate can safely be used for regression adjustment in a test of a new checkout page?</p><ul><li><b>A.</b> Number of checkout page views during the test</li><li><b>B.</b> Orders in the 28 days before assignment</li><li><b>C.</b> Whether the customer saw the new page</li><li><b>D.</b> Orders in the test period</li></ul></li>
<li><p>Why is the CUPED coefficient theta estimated on both arms pooled rather than separately in each arm?</p><ul><li><b>A.</b> Separate slopes can absorb part of the treatment effect into the adjustment</li><li><b>B.</b> Pooling makes the pre-period means equal</li><li><b>C.</b> The control arm's slope would always be zero</li><li><b>D.</b> It is faster to compute once</li></ul></li>
<li><p>A test randomises customers and reports revenue per order. The analyst computes the standard error as the standard deviation of order values over the square root of the number of orders. What happens?</p><ul><li><b>A.</b> The estimate is biased but the interval is right</li><li><b>B.</b> The interval is about right, because orders are many</li><li><b>C.</b> The interval is too wide</li><li><b>D.</b> The interval is too narrow, because one customer's orders are correlated</li></ul></li>
<li><p>To check a delta-method interval for orders per session in a customer-randomised test, what should a bootstrap resample?</p><ul><li><b>A.</b> Days, because traffic varies by day</li><li><b>B.</b> Orders, because they are the numerator</li><li><b>C.</b> Customers, each with all their sessions and orders</li><li><b>D.</b> Sessions, because the metric is per session</li></ul></li>
<li><p>In which design is a session-level binomial interval for orders per session correct?</p><ul><li><b>A.</b> When every customer has at least ten sessions</li><li><b>B.</b> When each session is randomised on its own and sessions are independent</li><li><b>C.</b> When the test is large</li><li><b>D.</b> Never: ratio metrics always need a bootstrap</li></ul></li>
<li><p>Post-stratifying a 90,000-customer test by city barely changes its standard error. What is the most likely reason?</p><ul><li><b>A.</b> The cities explain little of the variance of the metric</li><li><b>B.</b> Post-stratification only works with stratified assignment</li><li><b>C.</b> The weights should be the treatment arm's city shares</li><li><b>D.</b> The test is too small for strata to help</li></ul></li>
<li><p>In a post-stratified estimate, each city's difference in means is weighted by what?</p><ul><li><b>A.</b> The city's share of the treatment arm</li><li><b>B.</b> The inverse of the city's variance, to favour precise cities</li><li><b>C.</b> Equal weights, one per city</li><li><b>D.</b> The city's share of all customers in the test</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Monitoring and interference</h2>
<ol>
<li><p>Ruba must narrow the interval of revenue per triggered customer in T-101 and keep estimating exactly the effect on revenue. Which method does that?</p><ul><li><b>A.</b> Capping each order at the 99th percentile</li><li><b>B.</b> Regression adjustment on revenue in the 28 pre-period days</li><li><b>C.</b> Dropping the customers with the largest orders</li><li><b>D.</b> Switching to revenue per order</li></ul></li>
<li><p>A 28-day test with an O'Brien-Fleming plan shows z = 2.4 on day 5. The boundary on day 5 is infinite. Yazeed wants to launch. What do you tell him?</p><ul><li><b>A.</b> The result is significant at 5%, so launch</li><li><b>B.</b> We should not have looked at day 5 at all</li><li><b>C.</b> Keep running: the evidence has not crossed the planned boundary</li><li><b>D.</b> Switch to a Pocock plan, whose day-5 boundary is lower</li></ul></li>
<li><p>The Luqma team will check results on a public dashboard several times a day and may stop at any moment. The test has no fixed end date. Which design keeps the false-win rate at 5%?</p><ul><li><b>A.</b> A fixed test at alpha = 0.01</li><li><b>B.</b> A group sequential test with daily looks</li><li><b>C.</b> A Bonferroni correction over the expected number of looks</li><li><b>D.</b> An always-valid test such as mSPRT</li></ul></li>
<li><p>Four tests are planned, each randomised by customer. Which result is most likely biased by interference between customers?</p><ul><li><b>A.</b> A new wording on the checkout button</li><li><b>B.</b> A delivery-fee discount that raises orders at peak hours</li><li><b>C.</b> A dark mode for the app</li><li><b>D.</b> AI-ranked search for one customer's results</li></ul></li>
<li><p>Joud's switchback randomised 1,176 city-hour blocks; they contain about 83,000 orders. Ruba computes the standard error from the 83,000 orders as independent rows. What is wrong?</p><ul><li><b>A.</b> The block was randomised, so the standard error must be computed over blocks</li><li><b>B.</b> The estimate is biased by interference</li><li><b>C.</b> Nothing: more rows give a more precise estimate</li><li><b>D.</b> The first hour after each switch must always be dropped</li></ul></li>
<li><p>A team checks a test with no true effect every day for four weeks and stops the first time p &lt; 0.05. Roughly what false-win rate should they expect?</p><ul><li><b>A.</b> Under 5%, because later looks have more data</li><li><b>B.</b> 5%, because each look uses alpha = 0.05</li><li><b>C.</b> Between 20% and 30%</li><li><b>D.</b> 76%, which is 1 - 0.95 to the power 28</li></ul></li>
<li><p>Why does an O'Brien-Fleming boundary start very high and end near 2?</p><ul><li><b>A.</b> Because early data is more likely to contain errors</li><li><b>B.</b> Because it spends almost no alpha early and nearly all of it at the planned end</li><li><b>C.</b> Because the effect grows over time</li><li><b>D.</b> Because the variance grows with each look</li></ul></li>
<li><p>A test with a group sequential plan shows z = 2.3 on day 6; the day-6 boundary is 3.6. The product owner asks to launch now. What is the right answer?</p><ul><li><b>A.</b> Keep running: the evidence has not crossed the planned boundary</li><li><b>B.</b> Stop for futility: the effect is too small</li><li><b>C.</b> Restart the test with a lower boundary</li><li><b>D.</b> Launch: 2.3 is above 1.96</li></ul></li>
<li><p>What property lets an mSPRT keep its false-positive rate at or below alpha however often it is checked?</p><ul><li><b>A.</b> It only allows looks once a day</li><li><b>B.</b> It uses a smaller alpha than a fixed test</li><li><b>C.</b> Its threshold rises with every look</li><li><b>D.</b> Under no effect its likelihood ratio is a martingale with mean 1, so it rarely reaches 1 / alpha</li></ul></li>
<li><p>A test has a fixed 28-day maximum, daily batches of data and a team that will act only at planned looks. Which sequential design gives the most power while controlling false wins?</p><ul><li><b>A.</b> Daily checks at alpha = 0.05 with a two-day confirmation rule</li><li><b>B.</b> An always-valid test, because it is valid at any time</li><li><b>C.</b> A group sequential design with alpha spending</li><li><b>D.</b> A fixed test with a Bonferroni correction for 28 looks</li></ul></li>
<li><p>In an mSPRT, what does a much larger mixture width tau do?</p><ul><li><b>A.</b> It raises the false-positive rate above alpha</li><li><b>B.</b> It tunes the test to larger effects: quicker on big ones, weaker on small ones</li><li><b>C.</b> It makes the test equivalent to a fixed test</li><li><b>D.</b> It has no effect once the sample is large</li></ul></li>
<li><p>A food-delivery test gives treated customers priority for the next free courier, randomised by customer. The treated arm shows 10 minutes faster delivery. What is the best reading?</p><ul><li><b>A.</b> The difference mostly measures waiting moved from control to treated orders</li><li><b>B.</b> The test is invalid because of a sample ratio mismatch</li><li><b>C.</b> The rule saves about 10 minutes and should launch</li><li><b>D.</b> The rule saves about 5 minutes, half of the difference</li></ul></li>
<li><p>Which test is most exposed to interference between customers?</p><ul><li><b>A.</b> A larger font on the menu page</li><li><b>B.</b> A new order-tracking animation</li><li><b>C.</b> A new icon for the favourites list</li><li><b>D.</b> A courier bonus that changes which orders couriers accept</li></ul></li>
<li><p>A switchback randomised 1,200 city-hour blocks. How should the standard error of the effect be computed?</p><ul><li><b>A.</b> It cannot be computed; switchbacks need a Bayesian analysis</li><li><b>B.</b> Over the orders in all blocks, as independent rows</li><li><b>C.</b> Over the blocks, the unit that was randomised</li><li><b>D.</b> Over the six cities only</li></ul></li>
<li><p>What does a city-by-hour switchback give up in exchange for removing interference between customers?</p><ul><li><b>A.</b> Nothing: it is better in every way</li><li><b>B.</b> Power, because there are far fewer randomised units and they vary a lot</li><li><b>C.</b> Validity, because cities differ</li><li><b>D.</b> The ability to measure delivery time</li></ul></li>
<li><p>How can an analyst check whether carryover between hours biases a switchback before running it?</p><ul><li><b>A.</b> Simulate the design with and without carryover and compare the estimates</li><li><b>B.</b> Use one-hour blocks, which have no carryover</li><li><b>C.</b> Weight blocks by orders</li><li><b>D.</b> Run an A/A switchback in production for a month</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Decide and review</h2>
<ol>
<li><p>Joud wants the effect of giving priority to orders under a new dispatch rule, as it would be if every order in a city used it. Customer randomisation showed a 10.4-minute gain. Which design answers her question?</p><ul><li><b>A.</b> Customer randomisation with twice the traffic</li><li><b>B.</b> Order randomisation within each customer</li><li><b>C.</b> A city-by-hour switchback, analysed over blocks</li><li><b>D.</b> Customer randomisation with a Bonferroni correction</li></ul></li>
<li><p>A new AI menu search raises allergen complaints by +0.10 per 1,000 orders, 95% interval -0.20 to +0.40. The pre-registered limit is +0.30 on the upper bound. What does the rule say?</p><ul><li><b>A.</b> It holds: the difference is not significantly above zero</li><li><b>B.</b> It fails: the upper bound, +0.40, is above the limit</li><li><b>C.</b> It holds: the estimate, +0.10, is below the limit</li><li><b>D.</b> It cannot be judged without a longer test</li></ul></li>
<li><p>Ruba cut a test into 20 city-and-platform segments. One, Abha on Android, has p = 0.01; the other nineteen are above 0.2. With Benjamini-Hochberg at 5%, what does she report?</p><ul><li><b>A.</b> A win in Abha on Android, because 0.01 is below 0.05</li><li><b>B.</b> A win with a 1% chance of being false</li><li><b>C.</b> That segment analysis is never allowed</li><li><b>D.</b> No segment survives: 0.01 is above its threshold, 0.05 × 1 / 20 = 0.0025</li></ul></li>
<li><p>Rawan's board reads one page per test. Ruba's draft for T-101 opens with the method, then the data, then the effect, and ends with the decision. What should she change?</p><ul><li><b>A.</b> Put the decision and its reason first; the evidence follows</li><li><b>B.</b> Put the guardrail table first, because it decided</li><li><b>C.</b> Drop the interval and keep the point estimate</li><li><b>D.</b> Add a methods appendix to the page</li></ul></li>
<li><p>A write-up reports +3.0% over four weeks, interval 1.6% to 4.4%, and recommends launch. Its weekly lifts are 7.1%, 2.8%, 0.9% and 0.2%, each with a standard error of 0.8 points. What does the board decide?</p><ul><li><b>A.</b> Launch: the four-week interval is above zero</li><li><b>B.</b> Stop: the result is novelty, so there is no effect</li><li><b>C.</b> Iterate: run longer, because the settled effect is not shown to be above zero</li><li><b>D.</b> Apply Benjamini-Hochberg to the four weeks</li></ul></li>
<li><p>An AI assistant test shows allergen complaints up by 0.1 per 1,000 orders, 95% interval -0.2 to +0.5. The pre-registered harm limit is +0.3 on the upper bound. What does the rule say?</p><ul><li><b>A.</b> The harm guardrail holds, because the estimate is below the limit</li><li><b>B.</b> The guardrail cannot be judged until the test ends</li><li><b>C.</b> The harm guardrail holds, because the difference is not significant</li><li><b>D.</b> The harm guardrail fails, because the upper bound is above the limit</li></ul></li>
<li><p>Which pair of guardrails does an AI chat feature need that a new button usually does not?</p><ul><li><b>A.</b> Revenue per order and basket size</li><li><b>B.</b> Click-through rate and page views</li><li><b>C.</b> Response time in the tail and cost per conversation</li><li><b>D.</b> Sample ratio and trigger rate</li></ul></li>
<li><p>A test's weekly lifts are 5.8%, 2.5%, 0.5% and -0.5%; the four-week average is +2.1%. What should the write-up report as the long-run effect?</p><ul><li><b>A.</b> +5.8%, the first week, because that is when customers noticed</li><li><b>B.</b> The weekly pattern, with the last weeks as the settled effect, which is not shown to be above zero</li><li><b>C.</b> Nothing: novelty makes the test invalid</li><li><b>D.</b> +2.1%, the four-week average, because it uses all the data</li></ul></li>
<li><p>Sufrah's loyalty team launched three features in a half-year, each after a 14-day test: +1.6%, +1.1% and +1.1% in orders per customer. A 10% holdout kept on the old app reads, launched over holdout: +0.9%, +0.9%, +1.1%, +0.4% (interval -0.5% to +1.2%), +1.0%, and +1.1% (interval 0.2% to 2.0%) in month six. What should the team report as the long-run effect of the three launches?</p><ul><li><b>A.</b> +3.8%, the sum of the three 14-day test wins, each of them significant</li><li><b>B.</b> No lasting effect: the month-four interval includes zero</li><li><b>C.</b> +1.1%, the holdout's month-six reading, interval 0.2% to 2.0%</li><li><b>D.</b> +1.3%, the mean of the three test wins</li></ul></li>
<li><p>A test is cut into 20 independent segments with no true effect in any. About how often does at least one segment show p below 0.05?</p><ul><li><b>A.</b> About 64% of the time</li><li><b>B.</b> Every time</li><li><b>C.</b> About 25% of the time</li><li><b>D.</b> 5% of the time</li></ul></li>
<li><p>An analyst explores 20 segments to find leads for follow-up tests and can accept that a few of the leads are false. Which correction fits?</p><ul><li><b>A.</b> Holm, because it controls the false discovery rate</li><li><b>B.</b> Bonferroni, because it is the strictest</li><li><b>C.</b> None, because the segments are only exploratory</li><li><b>D.</b> Benjamini-Hochberg, which controls the share of false leads among those reported</li></ul></li>
<li><p>A segment survives Benjamini-Hochberg in a test whose overall result was flat. What should happen next?</p><ul><li><b>A.</b> Discard it, because segment analysis is never valid</li><li><b>B.</b> Launch the change for that segment only</li><li><b>C.</b> Run a new test pre-registered on that segment</li><li><b>D.</b> Report the overall result as a win</li></ul></li>
<li><p>T-101's primary interval is well above zero; the latency guardrail fails; the harm guardrail holds. The pre-registered rule says stop on harm, launch if all guardrails hold, otherwise iterate. What is the decision?</p><ul><li><b>A.</b> Stop, because a guardrail failed</li><li><b>B.</b> Iterate, because a non-harm guardrail failed</li><li><b>C.</b> Extend the test until latency improves</li><li><b>D.</b> Launch, because the lift is large</li></ul></li>
<li><p>What comes first on a one-page recommendation to a review board?</p><ul><li><b>A.</b> The decision and its reason</li><li><b>B.</b> The full table of all metrics</li><li><b>C.</b> The risks</li><li><b>D.</b> The method and the data sources</li></ul></li>
<li><p>A write-up reports a clean 2.1% lift. Its users are 50,912 treatment and 49,088 control on a planned 50/50 split. What does the board decide?</p><ul><li><b>A.</b> Stop: the feature caused customers to leave</li><li><b>B.</b> Launch at half traffic</li><li><b>C.</b> Launch: the interval is above zero</li><li><b>D.</b> Iterate: the sample ratio mismatch makes the result untrustworthy until its cause is fixed</li></ul></li>
<li><p>A write-up stopped on day 9 when the daily p-value first fell below 0.05. The pre-registered plan had a day-9 boundary of z = 3.47, and the planned day-28 analysis gives z = 0.27. What does the board decide?</p><ul><li><b>A.</b> Launch, because p was below 0.05</li><li><b>B.</b> Iterate, to run the test again</li><li><b>C.</b> Stop: the planned analysis shows no effect</li><li><b>D.</b> Launch, because day 9 was early evidence</li></ul></li>
<li><p>A courier batching change cut delivery cost by 6%; courier earnings per online hour fell by 4.2% (interval -5.9% to -2.5%) against a pre-registered limit of -2%. The team recommends launch for the saving. What does the board decide?</p><ul><li><b>A.</b> Iterate: lower the earnings limit to -5%</li><li><b>B.</b> Stop: the harm guardrail fails</li><li><b>C.</b> Launch in one city first</li><li><b>D.</b> Launch: the saving is large</li></ul></li>
</ol>

le":"Variance and heavy tails"},{"n":2,"label":"Session 2","title":"Regression adjustment"},{"n":3,"label":"Session 3","title":"Ratio metrics"},{"n":4,"label":"Session 4","title":"Stratification"}]},{"n":3,"id":"day3","label":"Day 3","title":"Monitoring and interference","sessions":[{"n":1,"label":"Session 1","title":"Group sequential designs"},{"n":2,"label":"Session 2","title":"Always-valid tests"},{"n":3,"label":"Session 3","title":"Interference in marketplaces"},{"n":4,"label":"Session 4","title":"Cluster and switchback designs"}]},{"n":4,"id":"day4","label":"Day 4","title":"Decide and review","sessions":[{"n":1,"label":"Session 1","title":"Testing AI features"},{"n":2,"label":"Session 2","title":"Many segments"},{"n":3,"label":"Session 3","title":"Writing the recommendation"},{"n":4,"label":"Session 4","title":"The review board"}]},{"n":5,"id":"capstone","label":"Capstone","title":"The capstone review board","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-trigger-q1","type":"single","prompt":"T-101 assigned 200,000 customers; 85,080 searched. You want the effect of the new ranking on the people it can reach. Which comparison do you report?","options":[{"key":"A","text":"Treatment customers who searched against all control customers"},{"key":"B","text":"Customers who searched in treatment against customers who searched in control"},{"key":"C","text":"All treatment customers against all control customers, because it uses more data"},{"key":"D","text":"Each searcher's orders before and after the first search"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The same trigger rule in both arms keeps randomisation intact inside the triggered group, and leaves out customers the ranking could not affect.","misconceptions":["Treats the trigger as a property of treatment only: the two groups then differ in who they are, not only in the ranking","","Assumes more data is always better: the untriggered customers add noise and no effect","Confuses exposure with assignment: the timing of the first search is not randomised, so before and after is not a controlled comparison"],"lo":["LO4"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-trigger","title":"Which comparison estimates the effect of AI ranking?"},"level":null,"pool":"checkpoint"},{"id":"check-srm-q1","type":"single","prompt":"A 50/50 test shows +3% orders with p = 0.002. Its sample ratio check gives p = 0.0004: the treatment arm has 1.2% fewer users than planned. What do you do?","options":[{"key":"A","text":"Report the lift: the arms are large and the gap is only 1.2%"},{"key":"B","text":"Reweight the treatment arm up to 50% and report the adjusted lift"},{"key":"C","text":"Report no result, find where users are lost, fix it and rerun"},{"key":"D","text":"Correct both p-values for multiple testing and report what survives"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A mismatch means assignment did not work as planned, so the arms are no longer comparable. No analysis of the outcome repairs that.","misconceptions":["Thinks a mismatch only costs a little precision; the missing users can create the whole lift","Assumes reweighting can restore randomisation; it cannot recover who was lost or why","","Treats the sample ratio check as one more metric to correct for multiplicity, not as a test of the experiment itself"],"lo":["LO6"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-srm","title":"The result looks good, the split does not"},"level":null,"pool":"checkpoint"},{"id":"check-metrics-q1","type":"single","prompt":"The AI ranking lifts orders by 3.9% (interval well above zero). Its p95 latency is 420 ms worse; the pre-registered limit was 300 ms. What does the spec say?","options":[{"key":"A","text":"Not a launch as is: the latency guardrail fails, so the decision rule applies"},{"key":"B","text":"Launch: a 3.9% lift is worth more than 120 ms"},{"key":"C","text":"Raise the latency limit to 450 ms and launch"},{"key":"D","text":"Report latency as a side note to the primary result"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Guardrails were written before the test so that a good primary cannot buy them off. The rule decides what follows: for T-101, iterate on latency.","misconceptions":["","Treats guardrails as weights to trade against the primary, which is what writing them in advance prevents","Moves the threshold after seeing the data, which turns the guardrail into decoration","Confuses a guardrail with a diagnostic: latency here is a limit, not an explanation"],"lo":["LO4"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-metrics","title":"The primary wins, a guardrail fails"},"level":null,"pool":"checkpoint"},{"id":"check-power-q1","type":"single","prompt":"A test needs 41,000 customers per arm to detect a 2% lift in orders with 80% power. The product manager now wants to detect 1%. Roughly how many per arm?","options":[{"key":"A","text":"82,000"},{"key":"B","text":"58,000"},{"key":"C","text":"20,500"},{"key":"D","text":"164,000"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The sample size grows with one over the effect squared: half the effect needs four times the customers.","misconceptions":["Assumes sample size grows in proportion to precision, when it grows with its square","Applies the square root the wrong way round","Confuses halving the effect with halving the power",""],"lo":["LO4"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-power","title":"How many customers for a smaller effect?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Ruba receives the results of a 28-day test with a 4% lift on the primary metric, all guardrails green. Which check does she run before reading any of it?","options":[{"key":"A","text":"Regression adjustment, to narrow the interval"},{"key":"B","text":"A false discovery correction over the segments"},{"key":"C","text":"The sample ratio check on the assignment counts"},{"key":"D","text":"A power calculation for the observed effect"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"If the split is not what was planned, no metric of the test can be trusted, so that check comes before every other.","misconceptions":["Puts precision before validity: a narrower interval on a broken test is still broken","Treats many segments as the first risk, when a broken split would void every segment too","","Confuses a planning tool with a check of a finished test"],"lo":["LO6"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which check comes first?"},"level":null,"pool":"checkpoint"},{"id":"check-capping-q1","type":"single","prompt":"Ruba wants to cap order value at the 99th percentile for T-101's revenue metric. Which data should set the cap?","options":[{"key":"A","text":"Order values from both arms pooled, or from history before the test"},{"key":"B","text":"Order values of the control arm only"},{"key":"C","text":"Each arm's own 99th percentile"},{"key":"D","text":"Whichever cap gives the smallest p-value"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A cap must be the same rule for both arms and fixed independently of the result; pooled or historical data does both.","misconceptions":["","Thinks the control arm is neutral, but a cap from one arm still treats the arms differently","Believes each arm deserves its own percentile, which makes the metric depend on the treatment","Chooses the cap after seeing the result, which lets the analyst pick a favourable estimate"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-capping","title":"Where does the cap come from?"},"level":null,"pool":"checkpoint"},{"id":"check-cuped-q1","type":"single","prompt":"Ruba ror"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-ratio","title":"Which interval is right for clicks per view?"},"level":null,"pool":"checkpoint"},{"id":"check-strata-q1","type":"single","prompt":"Sufrah plans a 2,000-customer pilot in two cities whose customers order at very different rates. Which design reduces the variance of the estimate most?","options":[{"key":"A","text":"A simple 50/50 randomisation, analysed as a simple difference"},{"key":"B","text":"Strata for every district, analysed per district"},{"key":"C","text":"Randomisation within each city, analysed with the city strata"},{"key":"D","text":"A separate test in each city, reported side by side"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"When the strata explain much of the variance and the test is small, randomising within strata prevents imbalance and removes the between-strata noise.","misconceptions":["Thinks a simple randomisation always balances, which is only true on average and fails most in small samples","Believes more strata are always better; tiny strata give noisy means and unstable variances","","Confuses reporting results per city with estimating the overall effect more precisely"],"lo":["LO1"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-strata","title":"When does stratifying by city pay off?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Ruba must narrow the interval of revenue per triggered customer in T-101 and keep estimating exactly the effect on revenue. Which method does that?","options":[{"key":"A","text":"Capping each order at the 99th percentile"},{"key":"B","text":"Regression adjustment on revenue in the 28 pre-period days"},{"key":"C","text":"Dropping the customers with the largest orders"},{"key":"D","text":"Switching to revenue per order"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A pre-period covariate removes predictable noise; its term has mean zero in each arm, so the expected difference, and so the estimand, is unchanged.","misconceptions":["Forgets that a cap changes what is estimated: capped revenue, not revenue","","Removes customers, which changes the population and the estimand","Changes the metric to a ratio with its own estimand"],"lo":["LO1"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which change narrows T-101's interval without changing the estimand?"},"level":null,"pool":"checkpoint"},{"id":"check-gst-q1","type":"single","prompt":"A 28-day test with an O'Brien-Fleming plan shows z = 2.4 on day 5. The boundary on day 5 is infinite. Yazeed wants to launch. What do you tell him?","options":[{"key":"A","text":"The result is significant at 5%, so launch"},{"key":"B","text":"We should not have looked at day 5 at all"},{"key":"C","text":"Keep running: the evidence has not crossed the planned boundary"},{"key":"D","text":"Switch to a Pocock plan, whose day-5 boundary is lower"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The boundary is what keeps the false-win rate at 5% over all looks; crossing 1.96 early is common under no effect.","misconceptions":["Applies the fixed-test threshold to a sequential plan, which is exactly the peeking error","Thinks a sequential plan forbids looking, when it only forbids acting below the boundary","","Moves the plan after seeing the data"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-gst","title":"Day 5: the dashboard is green"},"level":null,"pool":"checkpoint"},{"id":"check-avi-q1","type":"single","prompt":"The Luqma team will check results on a public dashboard several times a day and may stop at any moment. The test has no fixed end date. Which design keeps the false-win rate at 5%?","options":[{"key":"A","text":"A fixed test at alpha = 0.01"},{"key":"B","text":"A group sequential test with daily looks"},{"key":"C","text":"A Bonferroni correction over the expected number of "],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which design measures the courier-priority rule as it would run for everyone?"},"level":null,"pool":"checkpoint"},{"id":"check-harm-q1","type":"single","prompt":"A new AI menu search raises allergen complaints by +0.10 per 1,000 orders, 95% interval -0.20 to +0.40. The pre-registered limit is +0.30 on the upper bound. What does the rule say?","options":[{"key":"A","text":"It holds: the difference is not significantly above zero"},{"key":"B","text":"It fails: the upper bound, +0.40, is above the limit"},{"key":"C","text":"It holds: the estimate, +0.10, is below the limit"},{"key":"D","text":"It cannot be judged without a longer test"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The test must show the harm is below the limit. An interval that reaches +0.40 has not shown that; a larger test might.","misconceptions":["Reads a difference that is not significant as evidence of no harm","","Judges harm on the estimate, which lets a noisy test pass","Thinks a test can never judge harm, when the upper bound does exactly that"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-harm","title":"The harm estimate is small. Is that enough?"},"level":null,"pool":"checkpoint"},{"id":"check-segments-q1","type":"single","prompt":"Ruba cut a test into 20 city-and-platform segments. One, Abha on Android, has p = 0.01; the other nineteen are above 0.2. With Benjamini-Hochberg at 5%, what does she report?","options":[{"key":"A","text":"A win in Abha on Android, because 0.01 is below 0.05"},{"key":"B","text":"A win with a 1% chance of being false"},{"key":"C","text":"That segment analysis is never allowed"},{"key":"D","text":"No segment survives: 0.01 is above its threshold, 0.05 × 1 / 20 = 0.0025"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Benjamini-Hochberg compares the k-th smallest p-value with 0.05 × k / 20. The smallest, 0.01, is a
