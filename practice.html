 zero"},{"key":"D","text":"Apply Benjamini-Hochberg to the four weeks"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Week 4's interval, 0.2% ± 1.6 points, includes zero; the board needs the settled effect before a launch.","misconceptions":["Takes the four-week average as the settled effect when the weekly lifts show it fading","Stops for a fault that is not harm; the idea may still have a small settled effect","","Applies a segment correction to a question about time"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-board","title":"A write-up with a fading lift"},"level":null,"pool":"checkpoint"},{"id":"trigger-population","type":"single","prompt":"A test of a new filter on the restaurant list assigns 120,000 customers; 30,000 open the filter panel, which is logged in both arms. Which population gives the most precise unbiased estimate of the filter's effect?","options":[{"key":"A","text":"Everyone assigned, because the sample is four times larger"},{"key":"B","text":"Customers who opened the panel, in both arms"},{"key":"C","text":"Treatment customers who opened the panel against all control customers"},{"key":"D","text":"Customers who used the filter at least once, in treatment only"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The same trigger rule in both arms keeps the randomised comparison and leaves out customers the change could not reach.","misconceptions":["Thinks more rows always mean more precision; the 90,000 who never open the panel add noise and no effect","","Cuts only one arm, so the comparison is between different kinds of customers","Conditions on a behaviour the treatment causes and drops the control group"],"lo":["LO4"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"dilution-arithmetic","type":"single","prompt":"A test triggers 25% of assigned customers and shows a 6% lift among them, with similar baselines in both groups. Roughly what lift should the analysis over everyone assigned show?","options":[{"key":"A","text":"1.5%"},{"key":"B","text":"Nothing can be said without rerunning the test"},{"key":"C","text":"6%, because the effect is a property of the change"},{"key":"D","text":"24%, the triggered lift divided by the trigger rate"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The overall effect is the triggered effect times the share triggered: 6% x 0.25 = 1.5%.","misconceptions":["","Does not see that dilution is arithmetic when baselines are similar","Forgets that untriggered customers contribute zero effect to the average","Applies the dilution in the wrong direction"],"lo":["LO4"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"srm-response","type":"single","prompt":"A 50/50 test shows a 2.5% lift with p = 0.01. Its sample ratio check gives p = 0.0002; the treatment arm is short of users on one browser. What should the analyst report?","options":[{"key":"A","text":"The lift, after reweighting the arms to 50/50"},{"key":"B","text":"The lift, with a note on the mismatch"},{"key":"C","text":"The lift computed on the other browsers only"},{"key":"D","text":"No result until the cause is fixed and the test rerun"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A sample ratio mismatch means assignment did not work as planned, so the outcome comparison cannot be trusted.","misconceptions":["Believes weights can restore what randomisation lost","Treats a broken split as a minor caveat, when the missing users can create the lift","Assumes the loss is confined to one browser and that the rest stays randomised, which nobody has shown",""],"lo":["LO6"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"aa-rate-meaning","type":"single","prompt":"Five hundred A/A reshuffles of last month's data, analysed with the team's standard test, give 11% of p-values below 0.05. What is the most likely explanation?","options":[{"key":"A","text":"A/A tests always show more false wins than 5%"},{"key":"B","text":"Last month had unusual traffic"},{"key":"C","text":"The analysis is miscalibrated, for example tested at a smaller unit than the one randomised"},{"key":"D","text":"Five hundred reshuffles are too few to say anything"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A correct analysis gives about 5% false wins on A/A splits; a much higher rate means its variance is underestimated, often because the unit of analysis is wrong.","misconceptions":["Thinks false-win inflation is a property of A/A tests rather than of the analysis","Confuses the data with the procedure: reshuffles of any month should give about 5%","","Overlooks that 11% is far outside the 5% band for 500 reshuffles (about plus or minus 2 points)"],"lo":["LO6"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"guardrail-role","type":"single","prompt":"A pre-registered test of an AI search ranking has orders per customer as primary and a latency guardrail of at most +300 ms at p95. Results: orders +3% (interval above zero), p95 latency +410 ms. What follows?","options":[{"key":"A","text":"Launch, and raise the latency limit for the next test"},{"key":"B","text":"Not a launch as is: apply the written decision rule for a failed guardrail"},{"key":"C","text":"Rerun the test with latency as the primary metric"},{"key":"D","text":"Launch, since the primary metric won"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A guardrail is a limit written before the test; when it fails, the pre-registered rule decides, whatever the primary shows.","misconceptions":["Moves a threshold after seeing the data","","Confuses a guardrail with a goal","Treats guardrails as advisory, which defeats writing them in advance"],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"harm-guardrail-interval","type":"single","prompt":"A harm guardrail says complaints per 1,000 orders must not rise by more than 1.0. The estimate is +0.3 with a 95% interval from -0.5 to +1.4. Does the guardrail hold?","options":[{"key":"A","text":"No, because the upper bound exceeds 1.0"},{"key":"B","text":"No, because any rise in complaints fails a harm guardrail"},{"key":"C","text":"Yes, because the estimate is below 1.0"},{"key":"D","text":"Yes, because the difference is not statistically significant"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A harm guardrail holds only when the interval rules out a rise beyond the margin; an upper bound of 1.4 does not.","misconceptions":["","Ignores the margin the guardrail states","Reads the point estimate where a non-inferiority guardrail needs the interval","Treats \"no evidence of harm\" as evidence of no harm"],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"purpose-limitation-field","type":"single","prompt":"A test analysis needs the number of complaints per order. The data team offers the complaint category and the full complaint text, both collected for customer support and product improvement. Which should the analysis use?","options":[{"key":"A","text":"Neither, because complaints are personal data"},{"key":"B","text":"Both, because more detail gives a better metric"},{"key":"C","text":"The text only, because categories can be wrong"},{"key":"D","text":"The category only"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The category carries what the metric needs; reading the free text would exceed the minimum necessary for the purpose.","misconceptions":["Thinks personal data can never be used, when the law allows use for the purpose collected and within the minimum necessary","Ignores that the content must be limited to what the purpose needs","Picks the more identifying field for a count the category already gives",""],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"power-quadruple","type":"single","prompt":"A test needs 30,000 customers per arm to detect a 3% lift with 80% power. How many per arm are needed to detect a 1.5% lift with the same power?","options":[{"key":"A","text":"60,000"},{"key":"B","text":"42,000"},{"key":"C","text":"120,000"},{"key":"D","text":"15,000"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Sample size grows with one over the effect squared: half the effect needs four times the customers.","misconceptions":["Scales the sample size linearly with precision","Scales by the square root of two","","Thinks a smaller effect needs fewer customers"],"lo":["LO4"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"power-simulation-why","type":"single","prompt":"Why size a test by simulation on historical data when a formula exists?","options":[{"key":"A","text":"The formula is only valid for proportions"},{"key":"B","text":"Simulation uses the metric's real distribution and the exact analysis that will be run"},{"key":"C","text":"Simulation always gives a smaller sample size"},{"key":"D","text":"The formula needs the effect size, which simulation does not"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Simulation keeps the real tail and any analysis choice (triggering, capping, sequential looks) that a closed formula may not describe.","misconceptions":["Thinks the two-sample formula does not cover means","","Expects simulation to be more optimistic, when it can go either way","Overlooks that a simulation also needs the effect it injects"],"lo":["LO4"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"cap-pooled","type":"single","prompt":"An analyst caps basket value for a promotion test at each arm's own 99th percentile. The treatment arm has more large baskets. What is the problem?","options":[{"key":"A","text":"The cap now depends on the treatment, so it can create or hide a difference"},{"key":"B","text":"A 99th percentile cap is too loose to matter"},{"key":"C","text":"None: each arm is treated by the same rule"},{"key":"D","text":"The treatment arm is capped lower in relative terms than control"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A cap must be one value for both arms, fixed from pooled or historical data; per-arm caps make the metric depend on the treatment.","misconceptions":["","Ignores that the issue is where the cap comes from, not how tight it is","Thinks \"the same percentile\" means the same rule, when the cap values then differ by arm","Gets the direction of the distortion wrong"],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"cap-tradeoff","type":"single","prompt":"Capping order value at a lower percentile always reduces the standard error of revenue per customer. Why not cap at the median?","options":[{"key":"A","text":"A median cap would make the sample ratio check fail"},{"key":"B","text":"Regulators forbid capping below the 90th percentile"},{"key":"C","text":"The standard error would rise again below some cap"},{"key":"D","text":"The estimand moves away from revenue and the bias grows until it dominates the error"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each tighter cap removes noise but shifts what is estimated; past some point the bias costs more than the noise saved.","misconceptions":["Confuses a metric transformation with assignment","Invents a rule; the limit is statistical, not regulatory","Thinks the variance curve turns back up, when it keeps falling",""],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"cuped-gain","type":"single","prompt":"The correlation between a metric in the pre-period and in the test period is 0.6. Regression adjustment on the pre-period gives roughly what effective sample-size gain?","options":[{"key":"A","text":"1.6 times"},{"key":"B","text":"2.5 times"},{"key":"C","text":"1.56 times"},{"key":"D","text":"No gain, because the pre-period has no treatment effect"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The variance falls by a factor 1 - 0.36 = 0.64, so the gain is 1 / 0.64, about 1.56 times the customers.","misconceptions":["Adds the correlation to one instead of using its square","Uses one over (1 - rho) instead of one over (1 - rho squared)","","Confuses carrying no effect with carrying no information about the noise"],"lo":["LO1"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"cuped-covariate","type":"single","prompt":"Which covariate can safely be used for regression adjustment in a test of a new checkout page?","options":[{"key":"A","text":"Number of checkout page views during the test"},{"key":"B","text":"Orders in the 28 days before assignment"},{"key":"C","text":"Whether the customer saw the new page"},{"key":"D","text":"Orders in the test period"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A covariate measured before assignment cannot be affected by the treatment, so it removes noise without removing effect.","misconceptions":["Uses a variable the treatment can change, which absorbs part of the effect","","Conditions on exposure, which differs by arm by design","Adjusts the outcome for itself and removes the effect"],"lo":["LO1"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"cuped-theta-pooled","type":"single","prompt":"Why is the CUPED coefficient theta estimated on both arms pooled rather than separately in each arm?","options":[{"key":"A","text":"Separate slopes can absorb part of the treatment effect into the adjustment"},{"key":"B","text":"Pooling makes the pre-period means equal"},{"key":"C","text":"The control arm's slope would always be zero"},{"key":"D","text":"It is faster to compute once"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With one pooled theta the adjustment depends only on habits; arm-specific slopes let the adjustment differ by arm and bias the difference.","misconceptions":["","Randomisation, not pooling, makes the pre-period means equal in expectation","Misunderstands the slope as an effect of the treatment","Gives a convenience reason for a validity question"],"lo":["LO1"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"ratio-unit","type":"single","prompt":"A test randomises customers and reports revenue per order. The analyst computes the standard error as the standard deviation of order values over the square root of the number of orders. What happens?","options":[{"key":"A","text":"The estimate is biased but the interval is right"},{"key":"B","text":"The interval is about right, because orders are many"},{"key":"C","text":"The interval is too wide"},{"key":"D","text":"The interval is too narrow, because one customer's orders are correlated"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Orders of one customer move together; treating them as independent understates the variance. The delta method over customers fixes it.","misconceptions":["Locates the error in the point estimate instead of its variance","Thinks a large count makes rows independent","Gets the direction wrong: ignoring positive within-customer correlation makes intervals too narrow",""],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"ratio-bootstrap-unit","type":"single","prompt":"To check a delta-method interval for orders per session in a customer-randomised test, what should a bootstrap resample?","options":[{"key":"A","text":"Days, because traffic varies by day"},{"key":"B","text":"Orders, because they are the numerator"},{"key":"C","text":"Customers, each with all their sessions and orders"},{"key":"D","text":"Sessions, because the metric is per session"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The bootstrap must copy how the data was produced: customers were drawn and randomised, so customers are resampled.","misconceptions":["Picks a unit that was neither sampled nor randomised","Breaks the link between numerator and denominator","","Resamples the unit of analysis, reproducing the naive error"],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"ratio-naive-when-right","type":"single","prompt":"In which design is a session-level binomial interval for orders per session correct?","options":[{"key":"A","text":"When every customer has at least ten sessions"},{"key":"B","text":"When each session is randomised on its own and sessions are independent"},{"key":"C","text":"When the test is large"},{"key":"D","text":"Never: ratio metrics always need a bootstrap"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The binomial interval assumes independent trials; that holds when sessions are the randomised, independent unit.","misconceptions":["Thinks more sessions per customer make them independent","","Confuses sample size with the independence assumption","Overlooks that the naive interval is right when the unit of analysis is the randomisation unit"],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"strata-when","type":"single","prompt":"Post-stratifying a 90,000-customer test by city barely changes its standard error. What is the most likely reason?","options":[{"key":"A","text":"The cities explain little of the variance of the metric"},{"key":"B","text":"Post-stratification only works with stratified assignment"},{"key":"C","text":"The weights should be the treatment arm's city shares"},{"key":"D","text":"The test is too small for strata to help"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Strata remove only the variance between strata; when cities explain about 1% of it, little is gained.","misconceptions":["","Thinks post-stratification needs design-stage strata","Changes the estimand without touching the variance","Has the size effect backwards: imbalance, and so the gain, is larger in small tests"],"lo":["LO1"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"strata-weights","type":"single","prompt":"In a post-stratified estimate, each city's difference in means is weighted by what?","options":[{"key":"A","text":"The city's share of the treatment arm"},{"key":"B","text":"The inverse of the city's variance, to favour precise cities"},{"key":"C","text":"Equal weights, one per city"},{"key":"D","text":"The city's share of all customers in the test"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Weighting by each city's share of all customers keeps the estimand the average effect over the test population.","misconceptions":["Uses one arm's mix, which chance imbalance can distort","Describes a precision-weighted estimate, which targets a different average","Gives a small city the same say as a large one, changing the estimand",""],"lo":["LO1"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"peeking-rate","type":"single","prompt":"A team checks a test with no true effect every day for four weeks and stops the first time p \u003c 0.05. Roughly what false-win rate should they expect?","options":[{"key":"A","text":"Under 5%, because later looks have more data"},{"key":"B","text":"5%, because each look uses alpha = 0.05"},{"key":"C","text":"Between 20% and 30%"},{"key":"D","text":"76%, which is 1 - 0.95 to the power 28"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Daily looks at accumulating data are correlated, so the rate is far below the independent-tests figure but far above 5%; the course simulator gives 28%.","misconceptions":["Thinks more data per look lowers the chance of crossing at some look","Treats each look as if it were the only one","","Treats correlated daily looks as independent tests"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"obf-shape","type":"single","prompt":"Why does an O'Brien-Fleming boundary start very high and end near 2?","options":[{"key":"A","text":"Because early data is more likely to contain errors"},{"key":"B","text":"Because it spends almost no alpha early and nearly all of it at the planned end"},{"key":"C","text":"Because the effect grows over time"},{"key":"D","text":"Because the variance grows with each look"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The spending function allots tiny alpha to early looks, so early boundaries are strict and the last look keeps close to the full 5%.","misconceptions":["Confuses data quality with the statistical design","","Thinks the boundary tracks the effect rather than the error rate","Gets the direction wrong: the standard error shrinks as data accrues"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"gst-acting","type":"single","prompt":"A test with a group sequential plan shows z = 2.3 on day 6; the day-6 boundary is 3.6. The product owner asks to launch now. What is the right answer?","options":[{"key":"A","text":"Keep running: the evidence has not crossed the planned boundary"},{"key":"B","text":"Stop for futility: the effect is too small"},{"key":"C","text":"Restart the test with a lower boundary"},{"key":"D","text":"Launch: 2.3 is above 1.96"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Acting below the planned boundary would bring back the false-win inflation the plan prevents.","misconceptions":["","Confuses not crossing the efficacy boundary with evidence of no effect","Changes the plan after seeing data","Applies the fixed-horizon threshold to a sequential plan"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"msprt-guarantee","type":"single","prompt":"What property lets an mSPRT keep its false-positive rate at or below alpha however often it is checked?","options":[{"key":"A","text":"It only allows looks once a day"},{"key":"B","text":"It uses a smaller alpha than a fixed test"},{"key":"C","text":"Its threshold rises with every look"},{"key":"D","text":"Under no effect its likelihood ratio is a martingale with mean 1, so it rarely reaches 1 / alpha"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"By Ville's inequality, the chance that a mean-one nonnegative martingale ever reaches 1 / alpha is at most alpha.","misconceptions":["Thinks the guarantee depends on a fixed look schedule","Confuses the mechanism with a stricter threshold","Describes a correction schedule the mSPRT does not need",""],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"gst-vs-avi","type":"single","prompt":"A test has a fixed 28-day maximum, daily batches of data and a team that will act only at planned looks. Which sequential design gives the most power while controlling false wins?","options":[{"key":"A","text":"Daily checks at alpha = 0.05 with a two-day confirmation rule"},{"key":"B","text":"An always-valid test, because it is valid at any time"},{"key":"C","text":"A group sequential design with alpha spending"},{"key":"D","text":"A fixed test with a Bonferroni correction for 28 looks"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"When the maximum and the looks are known in advance, a group sequential design spends alpha for exactly that plan and has the most power.","misconceptions":["Invents an informal rule with an unknown error rate","Pays for flexibility that is not needed here","","Overcorrects by ignoring the correlation between looks"],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"msprt-tau","type":"single","prompt":"In an mSPRT, what does a much larger mixture width tau do?","options":[{"key":"A","text":"It raises the false-positive rate above alpha"},{"key":"B","text":"It tunes the test to larger effects: quicker on big ones, weaker on small ones"},{"key":"C","text":"It makes the test equivalent to a fixed test"},{"key":"D","text":"It has no effect once the sample is large"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"tau sets which effects the mixture weights most; the error guarantee holds for any tau.","misconceptions":["Thinks tau trades away validity; it only trades power between effect sizes","","Confuses tuning with the design family","Overlooks that tau shapes the statistic at every sample size"],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"sutva-break","type":"single","prompt":"A food-delivery test gives treated customers priority for the next free courier, randomised by customer. The treated arm shows 10 minutes faster delivery. What is the best reading?","options":[{"key":"A","text":"The difference mostly measures waiting moved from control to treated orders"},{"key":"B","text":"The test is invalid because of a sample ratio mismatch"},{"key":"C","text":"The rule saves about 10 minutes and should launch"},{"key":"D","text":"The rule saves about 5 minutes, half of the difference"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Shared couriers break no-interference: the difference counts the transfer of waiting twice, and says little about the effect of running the rule for everyone.","misconceptions":["","Names a different fault; nothing here suggests the split broke","Ignores that control customers lost the minutes the treated gained","Guesses a fixed share instead of measuring the global effect"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"interference-resources","type":"single","prompt":"Which test is most exposed to interference between customers?","options":[{"key":"A","text":"A larger font on the menu page"},{"key":"B","text":"A new order-tracking animation"},{"key":"C","text":"A new icon for the favourites list"},{"key":"D","text":"A courier bonus that changes which orders couriers accept"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Couriers serve both arms; changing their behaviour for treated orders changes service for control orders.","misconceptions":["A personal display change affects nobody else","Changes what one customer sees, not a shared resource","A purely visual change affects only the viewer",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"switchback-unit","type":"single","prompt":"A switchback randomised 1,200 city-hour blocks. How should the standard error of the effect be computed?","options":[{"key":"A","text":"It cannot be computed; switchbacks need a Bayesian analysis"},{"key":"B","text":"Over the orders in all blocks, as independent rows"},{"key":"C","text":"Over the blocks, the unit that was randomised"},{"key":"D","text":"Over the six cities only"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The unit of analysis matches the unit of randomisation: the block.","misconceptions":["Thinks the design rules out a frequentist interval","Treats orders as the randomised unit, which understates the variance","","Uses a coarser unit than the one randomised and wastes the design"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"switchback-cost","type":"single","prompt":"What does a city-by-hour switchback give up in exchange for removing interference between customers?","options":[{"key":"A","text":"Nothing: it is better in every way"},{"key":"B","text":"Power, because there are far fewer randomised units and they vary a lot"},{"key":"C","text":"Validity, because cities differ"},{"key":"D","text":"The ability to measure delivery time"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A switchback has hundreds or thousands of blocks in place of hundreds of thousands of customers, so it needs more time for the same power.","misconceptions":["Overlooks the loss of power from far fewer, noisier units","","Fixed effects and randomisation within city handle city differences","Confuses the design with what can be measured"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"carryover-check","type":"single","prompt":"How can an analyst check whether carryover between hours biases a switchback before running it?","options":[{"key":"A","text":"Simulate the design with and without carryover and compare the estimates"},{"key":"B","text":"Use one-hour blocks, which have no carryover"},{"key":"C","text":"Weight blocks by orders"},{"key":"D","text":"Run an A/A switchback in production for a month"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Simulating the design with the nuisance switched on and off measures its bias directly.","misconceptions":["","Gets it backwards: short blocks are where carryover matters most","Confuses the weighting question with the carryover question","Uses an expensive check that cannot see carryover of a real effect"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"harm-upper-bound","type":"single","prompt":"An AI assistant test shows allergen complaints up by 0.1 per 1,000 orders, 95% interval -0.2 to +0.5. The pre-registered harm limit is +0.3 on the upper bound. What does the rule say?","options":[{"key":"A","text":"The harm guardrail holds, because the estimate is below the limit"},{"key":"B","text":"The guardrail cannot be judged until the test ends"},{"key":"C","text":"The harm guardrail holds, because the difference is not significant"},{"key":"D","text":"The harm guardrail fails, because the upper bound is above the limit"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The test must show the harm is below the limit; an upper bound of +0.5 has not shown that.","misconceptions":["Judges harm on the estimate, which lets a noisy test pass","Thinks the rule needs more than the interval it was written for","Reads absence of evidence of harm as evidence of safety",""],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"ai-guardrails","type":"single","prompt":"Which pair of guardrails does an AI chat feature need that a new button usually does not?","options":[{"key":"A","text":"Revenue per order and basket size"},{"key":"B","text":"Click-through rate and page views"},{"key":"C","text":"Response time in the tail and cost per conversation"},{"key":"D","text":"Sample ratio and trigger rate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A model call is slow and paid for, so its tail latency and its cost each need a pre-registered limit.","misconceptions":["Names business metrics, not the costs a model adds","Names engagement metrics that apply to any feature","","Names trustworthiness checks every test needs"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"novelty-report","type":"single","prompt":"A test's weekly lifts are 5.8%, 2.5%, 0.5% and -0.5%; the four-week average is +2.1%. What should the write-up report as the long-run effect?","options":[{"key":"A","text":"+5.8%, the first week, because that is when customers noticed"},{"key":"B","text":"The weekly pattern, with the last weeks as the settled effect, which is not shown to be above zero"},{"key":"C","text":"Nothing: novelty makes the test invalid"},{"key":"D","text":"+2.1%, the four-week average, because it uses all the data"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"When the lift fades, the last weeks estimate the settled effect; the average overstates it.","misconceptions":["Reports the novelty peak as the effect","","Thinks a fading effect breaks the test rather than changing what it shows","Averages a novelty spike into the long-run estimate"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"holdout-report","type":"single","prompt":"Sufrah's loyalty team launched three features in a half-year, each after a 14-day test: +1.6%, +1.1% and +1.1% in orders per customer. A 10% holdout kept on the old app reads, launched over holdout: +0.9%, +0.9%, +1.1%, +0.4% (interval -0.5% to +1.2%), +1.0%, and +1.1% (interval 0.2% to 2.0%) in month six. What should the team report as the long-run effect of the three launches?","options":[{"key":"A","text":"+3.8%, the sum of the three 14-day test wins, each of them significant"},{"key":"B","text":"No lasting effect: the month-four interval includes zero"},{"key":"C","text":"+1.1%, the holdout's month-six reading, interval 0.2% to 2.0%"},{"key":"D","text":"+1.3%, the mean of the three test wins"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Short tests include novelty and do not add up; the holdout measures the combined, settled effect, and its later months agree with each other.","misconceptions":["Adds short-test wins as if each lasts and none overlaps","Judges a steady series by its one noisy month","","Averages per-feature test lifts instead of measuring the combined launch"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"twenty-tests","type":"single","prompt":"A test is cut into 20 independent segments with no true effect in any. About how often does at least one segment show p below 0.05?","options":[{"key":"A","text":"About 64% of the time"},{"key":"B","text":"Every time"},{"key":"C","text":"About 25% of the time"},{"key":"D","text":"5% of the time"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The chance of no false win is 0.95 to the power 20, about 0.36, so at least one appears about 64% of the time.","misconceptions":["","Confuses the expected one false win with a certain one","Guesses without the 1 - 0.95^20 calculation","Treats twenty tests as one"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"bh-vs-holm","type":"single","prompt":"An analyst explores 20 segments to find leads for follow-up tests and can accept that a few of the leads are false. Which correction fits?","options":[{"key":"A","text":"Holm, because it controls the false discovery rate"},{"key":"B","text":"Bonferroni, because it is the strictest"},{"key":"C","text":"None, because the segments are only exploratory"},{"key":"D","text":"Benjamini-Hochberg, which controls the share of false leads among those reported"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The false discovery rate is the right target for a list of leads; the family-wise rate suits a single costly claim.","misconceptions":["Confuses the family-wise error rate with the false discovery rate","Picks the strictest control when a share of false leads is acceptable","Forgets that uncorrected exploration produces false leads at a known high rate",""],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"segment-survivor","type":"single","prompt":"A segment survives Benjamini-Hochberg in a test whose overall result was flat. What should happen next?","options":[{"key":"A","text":"Discard it, because segment analysis is never valid"},{"key":"B","text":"Launch the change for that segment only"},{"key":"C","text":"Run a new test pre-registered on that segment"},{"key":"D","text":"Report the overall result as a win"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A corrected survivor is a lead worth confirming; a new pre-registered test confirms it.","misconceptions":["Treats a corrected finding as worthless instead of as a lead","Acts on a post-hoc finding without confirming it","","Lets a segment change the reading of the overall result"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"rule-literal","type":"single","prompt":"T-101's primary interval is well above zero; the latency guardrail fails; the harm guardrail holds. The pre-registered rule says stop on harm, launch if all guardrails hold, otherwise iterate. What is the decision?","options":[{"key":"A","text":"Stop, because a guardrail failed"},{"key":"B","text":"Iterate, because a non-harm guardrail failed"},{"key":"C","text":"Extend the test until latency improves"},{"key":"D","text":"Launch, because the lift is large"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Applied literally, the rule gives iterate: fix latency, then confirm.","misconceptions":["Treats a non-harm guardrail as harm","","Changes the test instead of applying the rule","Overrides the written rule after seeing the result"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"page-order","type":"single","prompt":"What comes first on a one-page recommendation to a review board?","options":[{"key":"A","text":"The decision and its reason"},{"key":"B","text":"The full table of all metrics"},{"key":"C","text":"The risks"},{"key":"D","text":"The method and the data sources"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The reader decides; the page opens with the decision so each number after it can be checked against it.","misconceptions":["","Leads with detail instead of the conclusion","Puts the caveats before the claim they qualify","Puts what the reader checks later before what the reader decides"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"srm-first","type":"single","prompt":"A write-up reports a clean 2.1% lift. Its users are 50,912 treatment and 49,088 control on a planned 50/50 split. What does the board decide?","options":[{"key":"A","text":"Stop: the feature caused customers to leave"},{"key":"B","text":"Launch at half traffic"},{"key":"C","text":"Launch: the interval is above zero"},{"key":"D","text":"Iterate: the sample ratio mismatch makes the result untrustworthy until its cause is fixed"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A chi-square p-value of about 10^-8 says the arms differ in who is in them; every later number is suspect.","misconceptions":["Assumes a cause for the mismatch without evidence","Picks a compromise the rule does not contain","Reads the result before checking the split",""],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"peek-review","type":"single","prompt":"A write-up stopped on day 9 when the daily p-value first fell below 0.05. The pre-registered plan had a day-9 boundary of z = 3.47, and the planned day-28 analysis gives z = 0.27. What does the board decide?","options":[{"key":"A","text":"Launch, because p was below 0.05"},{"key":"B","text":"Iterate, to run the test again"},{"key":"C","text":"Stop: the planned analysis shows no effect"},{"key":"D","text":"Launch, because day 9 was early evidence"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"No day crossed the planned boundary, and the day-28 analysis the plan called for found nothing.","misconceptions":["Applies the fixed-test threshold to a peek","Iterates on an idea the planned analysis found no effect for","","Treats an early crossing of 1.96 as stronger evidence, when it is weaker"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"harm-board","type":"single","prompt":"A courier batching change cut delivery cost by 6%; courier earnings per online hour fell by 4.2% (interval -5.9% to -2.5%) against a pre-registered limit of -2%. The team recommends launch for the saving. What does the board decide?","options":[{"key":"A","text":"Iterate: lower the earnings limit to -5%"},{"key":"B","text":"Stop: the harm guardrail fails"},{"key":"C","text":"Launch in one city first"},{"key":"D","text":"Launch: the saving is large"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The whole interval is below the limit; the board stops a test whose harm guardrail worsens.","misconceptions":["Moves a pre-registered limit after seeing the data","","Picks a compromise that still ships a change whose harm guardrail failed","Lets the primary metric override a harm guardrail"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"}]}</script>
